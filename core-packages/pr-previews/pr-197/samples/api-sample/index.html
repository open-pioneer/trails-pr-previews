<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>API Sample</title>
      <script type="module" crossorigin src="../../assets/BVH1Eo4GzyPm.js"></script>
      <link rel="modulepreload" crossorigin href="../../assets/TWg-czGxcKBx.js">
      <link rel="modulepreload" crossorigin href="../../assets/fjRjMJX3uA7m.js">
      <link rel="modulepreload" crossorigin href="../../assets/C7u3lWmwGHIl.js">

    </head>
    <body>
        <api-app id="app"></api-app>
    </body>
    <script>
        document.getElementById("app").addEventListener("my-custom-event", (event) => {
            console.log("Got event from app:", event);
        });

        customElements.whenDefined("api-app").then(() => {
            const app = document.getElementById("app");
            app.when().then(
                (api) => {
                    let count = 0;
                    setInterval(() => {
                        api.changeText(`Text has been changed ${++count} times.`);
                    }, 1000);
                },
                (error) => {
                    console.error("App did not initialize", error);
                }
            );
        });
    </script>
</html>
